name: BTC5M V2 Reconcile Evidence

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Full-market evidence workflow run ID to reconcile"
        required: true
      legacy_threshold:
        description: "Legacy stronger-side ask threshold"
        required: true
        default: "0.70"
  push:
    branches:
      - btc5m-v2-research
    paths:
      - ".github/reconcile-trigger.txt"

jobs:
  reconcile-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      SOURCE_RUN_ID: ${{ inputs.source_run_id || '34141279586' }}
      LEGACY_THRESHOLD: ${{ inputs.legacy_threshold || '0.70' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-v2.txt

      - name: Download original immutable evidence artifact
        uses: actions/download-artifact@v4
        with:
          name: btc5m-v2-full-market-${{ env.SOURCE_RUN_ID }}
          path: runtime
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.SOURCE_RUN_ID }}

      - name: Show downloaded evidence layout
        shell: bash
        run: find runtime -maxdepth 4 -type f | sort | head -200

      - name: Refresh fee schedules
        run: PYTHONPATH=. python scripts/btc5m_v2_enrich_fees.py --output-root runtime/data

      - name: Reconcile final resolutions from Gamma
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            PYTHONPATH=. python scripts/btc5m_v2_resolve.py --output-root runtime/data --force
            unresolved=$(python - <<'PY'
          import json
          from pathlib import Path
          count = 0
          for metadata in Path("runtime/data").glob("*/*/metadata.json"):
              payload = json.loads(metadata.read_text(encoding="utf-8"))
              resolution = payload.get("resolution") or {}
              if resolution.get("resolved") is not True or resolution.get("winning_side") not in {"UP", "DOWN"}:
                  count += 1
          print(count)
          PY
          )
            echo "resolution_attempt=$attempt unresolved=$unresolved"
            if [ "$unresolved" -eq 0 ]; then
              break
            fi
            if [ "$attempt" -lt 12 ]; then sleep 10; fi
          done

      - name: Rebuild readiness and ready-only causal dataset
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from btc5m_v2.research.readiness import readiness_report
          from btc5m_v2.research.ready_dataset import write_ready_dataset

          research = Path("runtime/research")
          research.mkdir(parents=True, exist_ok=True)
          report = readiness_report("runtime/data")
          (research / "readiness_reconciled.json").write_text(
              json.dumps(report, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, indent=2, sort_keys=True))
          if int(report.get("v2_ready_markets") or 0) > 0:
              summary = write_ready_dataset(
                  "runtime/data",
                  research / "btc5m_ready_features_reconciled.parquet",
                  sample_interval_ms=1000,
              )
              print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Re-run legacy latency control with final labels
        run: >-
          PYTHONPATH=. python scripts/btc5m_v2_paper_benchmark.py
          --input-root runtime/data
          --threshold "$LEGACY_THRESHOLD"
          --notional-usd 5
          --max-participation-pct 20
          --latency-ms 0 100 250 500 1000
          --output runtime/research/legacy_latency_sweep_reconciled.json

      - name: Create reconciliation manifest
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = {
              "mode": "delayed-public-data-reconciliation",
              "source_run_id": os.environ["SOURCE_RUN_ID"],
              "live_execution": False,
              "credentials_loaded": False,
              "readiness": json.loads(Path("runtime/research/readiness_reconciled.json").read_text(encoding="utf-8")),
              "legacy_latency_sweep": json.loads(Path("runtime/research/legacy_latency_sweep_reconciled.json").read_text(encoding="utf-8")),
          }
          Path("runtime/research/reconciliation_manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Upload reconciled evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc5m-v2-reconciled-${{ env.SOURCE_RUN_ID }}-${{ github.run_id }}
          path: |
            runtime/data/**
            runtime/research/**
          if-no-files-found: warn
          retention-days: 30

      - name: Require at least one fully V2-ready market
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("runtime/research/readiness_reconciled.json")
          if not path.exists():
              raise SystemExit("reconciled readiness report missing")
          report = json.loads(path.read_text(encoding="utf-8"))
          ready = int(report.get("v2_ready_markets") or 0)
          if ready < 1:
              raise SystemExit("reconciliation produced zero fully V2-ready markets")
          print(f"reconciled_v2_ready_markets={ready}")
          PY
