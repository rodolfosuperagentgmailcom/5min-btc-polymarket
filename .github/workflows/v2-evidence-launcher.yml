name: BTC5M V2 Evidence Launcher

on:
  workflow_dispatch:
    inputs:
      markets:
        description: "Aligned 5-minute markets to collect (1-12)"
        required: true
        default: "1"
      legacy_threshold:
        description: "Legacy stronger-side ask threshold"
        required: true
        default: "0.70"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/v2-evidence-launcher.yml"

concurrency:
  group: btc5m-v2-evidence-launcher
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      V2_MARKETS: ${{ github.event_name == 'workflow_dispatch' && inputs.markets || '1' }}
      V2_THRESHOLD: ${{ github.event_name == 'workflow_dispatch' && inputs.legacy_threshold || '0.70' }}

    steps:
      - name: Check out BTC5M V2 research/paper branch
        uses: actions/checkout@v4
        with:
          ref: btc5m-v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-v2.txt

      - name: Validate launcher inputs
        shell: bash
        run: |
          set -euo pipefail
          python - "$V2_MARKETS" "$V2_THRESHOLD" <<'PY'
          import sys
          markets = int(sys.argv[1])
          threshold = float(sys.argv[2])
          if not 1 <= markets <= 12:
              raise SystemExit("markets must be between 1 and 12")
          if not 0.50 <= threshold <= 0.99:
              raise SystemExit("legacy_threshold must be between 0.50 and 0.99")
          print(f"markets={markets} legacy_threshold={threshold:.2f}")
          PY

      - name: Validate public-data operator entrypoint
        run: |
          bash -n scripts/btc5m_v2_ctl.sh
          PYTHONPATH=. python scripts/btc5m_v2_study.py --help >/dev/null

      - name: Collect aligned public evidence
        shell: bash
        run: |
          set -euo pipefail
          set +e
          PYTHONPATH=. python scripts/btc5m_v2_study.py \
            --markets "$V2_MARKETS" \
            --output-root runtime/data \
            --dataset-path runtime/research/v2_ready.parquet \
            --no-dataset
          rc=$?
          set -e
          # Exit code 2 means evidence was captured but no market was fully ready yet,
          # commonly because final resolution has not propagated. Reconciliation follows.
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            exit "$rc"
          fi
          echo "initial_study_exit_code=$rc"

      - name: Refresh market-specific fee metadata
        run: PYTHONPATH=. python scripts/btc5m_v2_enrich_fees.py --output-root runtime/data

      - name: Poll for final resolutions
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            PYTHONPATH=. python scripts/btc5m_v2_resolve.py --output-root runtime/data --force
            remaining=$(python - <<'PY'
          import json
          from pathlib import Path
          unresolved = 0
          for path in Path('runtime/data').glob('*/*/metadata.json'):
              result = json.loads(path.read_text(encoding='utf-8')).get('resolution') or {}
              if result.get('resolved') is not True or result.get('winning_side') not in {'UP', 'DOWN'}:
                  unresolved += 1
          print(unresolved)
          PY
            )
            echo "resolution_attempt=$attempt unresolved=$remaining"
            if [ "$remaining" = "0" ]; then
              break
            fi
            if [ "$attempt" -lt 24 ]; then
              sleep 10
            fi
          done

      - name: Write readiness report
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python - <<'PY'
          import json
          from pathlib import Path
          from btc5m_v2.research.readiness import readiness_report

          report = readiness_report('runtime/data')
          out = Path('runtime/research/readiness.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(report, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps({
              'markets_seen': report['markets_seen'],
              'v2_ready_markets': report['v2_ready_markets'],
              'decision_window_markets': report.get('decision_window_markets'),
              'resolved_markets': report['resolved_markets'],
              'verified_btc_reference_markets': report['verified_btc_reference_markets'],
              'fee_ready_markets': report.get('fee_ready_markets'),
              'reason_counts': report['reason_counts'],
          }, indent=2, sort_keys=True))
          PY

      - name: Build ready-only causal dataset
        shell: bash
        run: |
          set -euo pipefail
          ready=$(python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('runtime/research/readiness.json').read_text(encoding='utf-8'))
          print(int(report.get('v2_ready_markets') or 0))
          PY
          )
          if [ "$ready" -gt 0 ]; then
            PYTHONPATH=. python scripts/btc5m_v2_build_dataset.py \
              --input-root runtime/data \
              --output runtime/research/btc5m_features.parquet \
              --sample-interval-ms 1000
          else
            echo "no v2-ready markets; dataset build skipped"
          fi

      - name: Benchmark legacy threshold with modeled latency
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=. python scripts/btc5m_v2_paper_benchmark.py \
            --input-root runtime/data \
            --threshold "$V2_THRESHOLD" \
            --notional-usd 5 \
            --max-participation-pct 20 \
            --latency-ms 0 100 250 500 1000 \
            --output runtime/research/legacy_latency_sweep.json || true

      - name: Write launcher manifest
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          readiness_path = Path('runtime/research/readiness.json')
          readiness = json.loads(readiness_path.read_text(encoding='utf-8')) if readiness_path.exists() else None
          manifest = {
              'mode': 'public-data-only',
              'live_execution': False,
              'credentials_loaded': False,
              'order_path_used': False,
              'requested_markets': int(os.environ['V2_MARKETS']),
              'legacy_threshold': float(os.environ['V2_THRESHOLD']),
              'source_branch': 'btc5m-v2',
              'readiness': readiness,
          }
          out = Path('runtime/research/launcher_manifest.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY

      - name: Upload evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: btc5m-v2-launcher-${{ github.run_id }}
          path: |
            runtime/data/**
            runtime/research/**
          if-no-files-found: warn
          retention-days: 14

      - name: Require at least one V2-ready market
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('runtime/research/readiness.json')
          if not path.exists():
              raise SystemExit('readiness report missing')
          report = json.loads(path.read_text(encoding='utf-8'))
          ready = int(report.get('v2_ready_markets') or 0)
          print(f"v2_ready_markets={ready}")
          if ready < 1:
              raise SystemExit('no V2-ready markets collected; raw evidence was uploaded for diagnosis')
          PY
