name: BTC5M V2 Fee Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - btc5m-v2-research
    paths:
      - "btc5m_v2/market_fees.py"
      - "btc5m_v2/market.py"
      - "btc5m_v2/config.py"
      - "config/btc_5m_v2.yaml"
      - "scripts/btc5m_v2_fee_smoke.py"
      - ".github/workflows/v2-fee-smoke.yml"

jobs:
  current-market-fees:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-v2.txt
      - name: Fetch current BTC5M CLOB fee schedule
        run: PYTHONPATH=. python scripts/btc5m_v2_fee_smoke.py
