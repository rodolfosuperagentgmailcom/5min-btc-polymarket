name: BTC5M V2 Chainlink Discovery

on:
  workflow_dispatch:
  push:
    branches:
      - btc5m-v2-research
    paths:
      - "btc5m_v2/feeds/chainlink.py"
      - "scripts/btc5m_v2_chainlink_discovery.py"
      - "requirements-v2.txt"
      - ".github/workflows/v2-chainlink-discovery.yml"

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-v2.txt
      - run: PYTHONPATH=. python scripts/btc5m_v2_chainlink_discovery.py
