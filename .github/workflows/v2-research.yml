name: BTC5M V2 Research

on:
  pull_request:
    paths:
      - "btc5m_v2/**"
      - "scripts/btc5m_v2_*.py"
      - "tests/test_v2_*.py"
      - "requirements-v2.txt"
      - ".github/workflows/v2-research.yml"
  push:
    branches:
      - btc5m-v2-research

jobs:
  research-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-v2.txt
      - run: PYTHONPATH=. pytest -q tests/test_v2_*.py
